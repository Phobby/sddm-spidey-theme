[General]
# Font ailesi. Boş bırakılırsa assets/fonts içindeki Rajdhani kullanılır.
font=
# Vurgu rengi (seçili kullanıcı, buton, fokus çizgisi)
accentColor=#e8363f
# Panel genişliği (piksel, 1080p referansında; ekran yüksekliğine göre ölçeklenir)
panelWidth=400
# Panel tarafı: right | left
panelSide=right
# Cam efekti bulanıklık miktarı: 0.0 – 1.0
blur=0.7
# Güç butonları: panel | bottom-right | bottom-left | top-right | hidden
powerButtons=panel
# Sol üstte saat/tarih: true | false
showClock=true
clockFormat=HH:mm
dateFormat=d MMMM dddd
# Tarih dili (ör. tr_TR, en_US). Boş = sistem dili
locale=tr_TR
