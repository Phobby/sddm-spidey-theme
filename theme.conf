[General]
# Font ailesi. Boş = assets/fonts içindeki Rajdhani
fontFamily=
# Vurgu rengi: şifre alanı kenarlığı, UNLOCK butonu (koyu tonu), parıltı
accentColor=#b9a6ff
# Kartın koyu katmanının opaklığı: 0.0 – 1.0
cardOpacity=0.55
# Kart arkasındaki video bulanıklığı: 0.0 – 1.0
blurAmount=0.8
# Kart genişliği, ekran genişliğine oran (0.15 – 0.6)
cardWidth=0.25
# Panel tarafı: right | left
panelSide=right
# Genel ölçek çarpanı (boyutlar ekran yüksekliğine göre 1440p referansında)
uiScale=1.0
clockFormat=HH:mm
dateFormat=MMM d
# Tarih dili (ay adları için)
locale=en_US
