[General]
# Font family. Empty = bundled Rajdhani from assets/fonts
fontFamily=
# Accent color: password field border, UNLOCK button (darker shade), glow
accentColor=#b9a6ff
# Opacity of the dark glass layer: 0.0 – 1.0
cardOpacity=0.55
# Blur of the video behind the glass: 0.0 – 1.0
blurAmount=0.8
# Card width as a fraction of the screen width (0.15 – 0.6)
cardWidth=0.25
# Panel side: right | left
panelSide=right
# Global scale factor (sizes follow screen height, 1440p reference)
uiScale=1.0
clockFormat=HH:mm
dateFormat=MMM d
# Date language (for month names)
locale=en_US
